repositories:
  apt:
    - ppa:fish-shell/release-4
  flatpak:
    - location: flathub
      url: https://dl.flathub.org/repo/flathub.flatpakrepo

packages:
  - bat
  - copyq
  - curl
  - duf

  - dust:
      dnf: du-dust
      snap:

  - fish

  - flatpak:
      apt:

  - git
  - guake
  - htop
  - micro

  - paperwm:
      git:
        repo: https://github.com/paperwm/PaperWM.git
        command: |
          GNOME_SHELL_VERSION=$(gnome-shell --version | cut -d' ' -f3 | cut -d'.' -f1)
          if [ "$GNOME_SHELL_VERSION" -lt 45 ]; then
            git checkout gnome-44
            git pull
            ./install.sh
          else
             make install
          fi

  - platformio:
      pip:

  - python3-pip
  - thefuck
  - tio

  - yq:
      dnf:
      snap:

  - zed:
      command: "curl -f https://zed.dev/install.sh | sh"

  - zen:
      flatpak:
        name: app.zen_browser.zen
