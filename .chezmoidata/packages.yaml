packages:
  universal:
    package_managers:
      # These packages are called the same for all targeted package managers
      - bat
      - copyq
      - curl
      - du-dust
      - duf
      - fish
      - git
      - guake
      - htop
      - micro
      - python3-pip
      - thefuck
      - tio

    flatpak:
      - flathub:
        - app.zen_browser.zen

    pip:
      - platformio

    git:
      - url: https://github.com/paperwm/PaperWM.git
        install_command: "make install"

    wild_west:
      # Piping downloaded scripts straight to sh/bash is not exactly safe
      # but it's the recommended install method for some programs.
      - name: zed
        command: "curl -f https://zed.dev/install.sh | sh"

  ubuntu:
    apt_repositories:
      - ppa:fish-shell/release-4
    apt:
      - flatpak

  fedora:
    dnf:
